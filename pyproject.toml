[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ndf-backend"
version = "0.1.0"
description = "NDF Bayi Portal API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy[asyncio]>=2.0.51,<2.2",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pyjwt>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.20,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.4,<9.0", "pytest-asyncio>=1.1,<2.0", "ruff>=0.12,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
